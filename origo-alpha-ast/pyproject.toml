[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "origo-alpha-ast"
version = "1.0.0"
description = "Reference alpha-equivalent AST hashing for Origo Overlay Python selectors"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Euzebio Soares Dos Santos"}
]
keywords = ["ast", "alpha-equivalence", "provenance", "static-analysis", "origo"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
origo-alpha-ast = "origo_alpha_ast.core:main"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.8", "mypy>=1.13", "twine>=5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["origo_alpha_ast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["tests/vectors"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
packages = ["origo_alpha_ast"]
mypy_path = "src"
